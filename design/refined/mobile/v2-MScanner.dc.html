<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Strip Scanner</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}a{color:#FFFFFF}a:hover{color:#E4E7EE}a:focus-visible,button:focus-visible{outline:2px solid #D4A04C;outline-offset:2px}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0E1626;color:#FFFFFF;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;overflow:hidden">

<header style="display:flex;align-items:center;gap:12px;padding:12px 16px">
<a href="v2-MHome.dc.html" aria-label="Close scanner" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#1C2638;flex-shrink:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<div style="flex-grow:1;display:flex;flex-direction:column;gap:6px">
<span style="font-size:15px;color:#C9D0DC">Step 2 of 3</span>
<div aria-hidden="true" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px"><div style="height:4px;border-radius:2px;background:#FFFFFF"></div><div style="height:4px;border-radius:2px;background:#FFFFFF"></div><div style="height:4px;border-radius:2px;background:#3A4560"></div></div>
</div>
</header>

<div style="padding:4px 16px 12px">
<h1 style="margin:0;font-size:22px;font-weight:600;line-height:1.3">Line up the strip and the colour card</h1>
<p style="margin:4px 0 0;font-size:16px;line-height:1.45;color:#C9D0DC">Lay both flat. Hold the phone about one hand above them.</p>
</div>

<div role="img" aria-label="Camera preview with two guide frames: colour card on the left, strip on the right" style="flex-grow:1;margin:0 8px;border-radius:12px;position:relative;overflow:hidden;background:#71695A">
<div style="position:absolute;inset:0;background:repeating-linear-gradient(90deg,#736B5C 0 2px,#6D6556 2px 5px)"></div>
<!-- card -->
<div style="position:absolute;left:36px;top:58px;width:120px;height:286px;background:#F4F1E8;border-radius:4px;transform:rotate(-1deg);display:flex;flex-direction:column;gap:6px;padding:10px;box-sizing:border-box">
<div style="flex:1;background:#F2EEE3;border:1px solid #CFC8B8"></div><div style="flex:1;background:#E9DFA8"></div><div style="flex:1;background:#D7BE6A"></div><div style="flex:1;background:#C9A54A"></div><div style="flex:1;background:#9F7A2C"></div>
</div>
<div style="position:absolute;left:28px;top:50px;width:136px;height:302px;border:2px solid #FFFFFF;border-radius:8px;box-sizing:border-box"></div>
<!-- strip -->
<div style="position:absolute;left:226px;top:76px;width:44px;height:250px;background:#F7F4EA;border-radius:3px;transform:rotate(4deg);display:flex;flex-direction:column;justify-content:space-around;padding:14px 8px;box-sizing:border-box"><div style="height:40px;background:#E5DB9E"></div><div style="height:40px;background:#C7A245"></div><div style="height:40px;background:#EFEADC"></div></div>
<div style="position:absolute;left:206px;top:50px;width:84px;height:302px;border:2px dashed #FFD58A;border-radius:8px;box-sizing:border-box"></div>
<span style="position:absolute;left:28px;top:360px;font-size:14px;background:#0E1626;padding:4px 8px;border-radius:4px">Card</span>
<span style="position:absolute;left:206px;top:360px;font-size:14px;background:#0E1626;padding:4px 8px;border-radius:4px">Strip</span>
</div>

<section aria-label="Camera checks" style="padding:12px 16px 0;display:flex;flex-direction:column;gap:8px">
<ul role="status" aria-live="polite" style="list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<li style="background:#1C2638;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;color:#C9D0DC">Light</span><span style="font-size:16px;font-weight:600;display:flex;align-items:center;gap:4px"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#9FD3AE" stroke-width="2.2" aria-hidden="true"><path d="M3 8.5l3 3 7-7"></path></svg>Good</span></li>
<li style="background:#1C2638;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;color:#C9D0DC">Focus</span><span style="font-size:16px;font-weight:600;display:flex;align-items:center;gap:4px"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#9FD3AE" stroke-width="2.2" aria-hidden="true"><path d="M3 8.5l3 3 7-7"></path></svg>Sharp</span></li>
<li style="background:#3B2E14;border:1px solid #FFD58A;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;color:#FFE6B8">Strip</span><span style="font-size:16px;font-weight:600;display:flex;align-items:center;gap:4px"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#FFD58A" stroke-width="2.2" aria-hidden="true"><path d="M8 2l6.5 12h-13z"></path></svg>Tilted</span></li>
</ul>
<p style="margin:0;font-size:14px;color:#C9D0DC">These checks look at photo quality only, not at the oil.</p>
</section>

<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 24px 20px">
<button style="min-width:80px;min-height:48px;background:#1C2638;color:#FFFFFF;border:0;border-radius:8px;font:500 16px 'IBM Plex Sans',sans-serif">Help</button>
<a href="v2-MResults.dc.html" aria-label="Take photo" style="width:80px;height:80px;border-radius:50%;border:4px solid #FFFFFF;display:flex;align-items:center;justify-content:center;box-sizing:border-box"><span style="width:62px;height:62px;border-radius:50%;background:#FFFFFF;display:block"></span></a>
<button aria-pressed="false" style="min-width:80px;min-height:48px;background:#1C2638;color:#FFFFFF;border:0;border-radius:8px;font:500 16px 'IBM Plex Sans',sans-serif">Light</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
